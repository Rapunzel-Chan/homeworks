[tool.poetry]
name = "pythonproject5"
version = "0.1.0"
description = "Программа для домашки"
authors = ["RapunzelChan <rapuncel.chan24@gmail.com>"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)"
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
scapy = ">=2.7.0,<3.0.0"
pandas = "^3.0.0"
matplotlib = "^3.10.8"
seaborn = "^0.13.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
